name: Lint

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck revive-private-pages.sh install.sh

  bash-3-2-syntax:
    # macOS ships Bash 3.2 – make sure the scripts still parse there
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check with /bin/bash
        run: |
          /bin/bash --version | head -n1
          /bin/bash -n revive-private-pages.sh
          /bin/bash -n install.sh
          /bin/bash revive-private-pages.sh --help >/dev/null
